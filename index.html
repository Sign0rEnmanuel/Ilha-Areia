<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Os valores %SEO_*% vêm de src/content (plugin seo-from-content em vite.config.js) -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f6a6b9" />
    <link rel="canonical" href="%SEO_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO local -->
    <meta name="geo.region" content="%SEO_GEO_REGION%" />
    <meta name="geo.placename" content="%SEO_GEO_PLACENAME%" />
    <meta name="geo.position" content="%SEO_GEO_POSITION%" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="%SEO_SITE_NAME%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SEO_URL%/" />
    <meta property="og:image" content="%SEO_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SEO_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="%SEO_IMAGE_ALT%" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">%SEO_NOSCRIPT%</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
